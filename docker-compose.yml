services:
  postgres:
    image: postgres:16-alpine
    container_name: nextgen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nextgen}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nextgen_secret_pwd}
      POSTGRES_DB: ${DB_NAME:-nextgen_cybersec}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nextgen} -d ${DB_NAME:-nextgen_cybersec}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nextgen-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextgen-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-nextgen}
      DB_PASSWORD: ${DB_PASSWORD:-nextgen_secret_pwd}
      DB_NAME: ${DB_NAME:-nextgen_cybersec}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production-min32chars}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nextgen.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPass123!}
      NMAP_PRIVILEGED: "1"
    ports:
      - "${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    cap_add:
      - NET_RAW
    volumes:
      - ./backend/data:/app/data
    networks:
      - nextgen-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextgen-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - nextgen-net

volumes:
  postgres_data:
    driver: local

networks:
  nextgen-net:
    driver: bridge

