name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI (Go 1.22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download Go Dependencies
        run: go mod download

      - name: Run Go Vet (Static Analysis)
        run: go vet ./...

      - name: Run Fast Backend Tests (No PostgreSQL)
        run: go test ./...

      - name: Build Backend Binaries
        run: go build -v ./...

  integration:
    name: PostgreSQL Integration (Go 1.22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nextgen_ci_test
          POSTGRES_USER: nextgen_test
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U nextgen_test -d nextgen_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: ${{ job.services.postgres.ports[5432] }}
      TEST_DB_NAME: nextgen_ci_test
      TEST_DB_USER: nextgen_test
      TEST_DB_PASSWORD: ephemeral-ci-only
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Run Required PostgreSQL Integration Tests
        run: go test -tags=integration -count=1 -v ./internal/repository/postgres

  frontend:
    name: Frontend CI (React / TypeScript / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Tests (Vitest)
        run: npm test

      - name: Type-Check & Build Frontend
        run: npm run build

