name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI (Go 1.22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download Go Dependencies
        run: go mod download

      - name: Run Go Vet (Static Analysis)
        run: go vet ./...

      - name: Run Fast Backend Tests (No PostgreSQL)
        run: go test ./...

      - name: Build Backend Binaries
        run: go build -v ./...

  integration:
    name: PostgreSQL Integration (Go 1.22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nextgen_ci_test
          POSTGRES_USER: nextgen_test
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U nextgen_test -d nextgen_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_NAME: nextgen_ci_test
      TEST_DB_USER: nextgen_test
      TEST_DB_PASSWORD: ephemeral-ci-only
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Run Required PostgreSQL Integration Tests
        env:
          TEST_DB_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: go test -tags=integration -count=1 -v ./internal/repository/postgres

  frontend:
    name: Frontend CI (React / TypeScript / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Tests (Vitest)
        run: npm test

      - name: Type-Check & Build Frontend
        run: npm run build

  docker:
    name: Docker Images (Linux amd64)
    needs: [backend, frontend, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag nextgen-backend:ci ./backend

      - name: Build Frontend Image
        run: docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag nextgen-frontend:ci ./frontend

      - name: Check Image Prerequisites
        run: |
          docker run --rm --network none --entrypoint nmap nextgen-backend:ci --version
          docker run --rm --network none --add-host backend:127.0.0.1 nextgen-frontend:ci nginx -t

      - name: Package Images and Compose Files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker-artifact
          docker save nextgen-backend:ci nextgen-frontend:ci | gzip > docker-artifact/nextgen-images.tar.gz
          cp docker-compose.yml compose.images.yml docker-artifact/
          printf '%s\n' "$GITHUB_SHA" > docker-artifact/REVISION.txt
          cd docker-artifact
          sha256sum nextgen-images.tar.gz > SHA256SUMS

      - name: Upload Docker Package
        uses: actions/upload-artifact@v4
        with:
          name: nextgen-docker-linux-amd64-${{ github.sha }}
          path: docker-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

